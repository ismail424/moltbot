services:
  moltbot-gateway:
    # FIX 1: Use 'build: .' to create the image from code
    build: .
    init: true
    restart: unless-stopped
    environment:
      HOME: /home/node
      TERM: xterm-256color
      # FIX 2: Bind to 0.0.0.0 so Coolify can proxy the connection
      CLAWDBOT_GATEWAY_BIND: 0.0.0.0
      CLAWDBOT_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
      # Optional Claude keys (keep them if you use Claude)
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      # FIX 3: Use named volumes so you don't lose data on restarts
      - molt_config:/home/node/.clawdbot
      - molt_workspace:/home/node/clawd
    ports:
      - "18789:18789"
      - "18790:18790"
    command: ["node", "dist/index.js", "gateway", "--bind", "0.0.0.0", "--port", "18789", "--allow-unconfigured"]
volumes:
  molt_config:
  molt_workspace: