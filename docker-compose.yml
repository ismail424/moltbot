services:
  moltbot-gateway:
    build: .
    # FIX: Run as root to fix the "Permission denied" error
    user: root
    
    init: true
    restart: unless-stopped
    environment:
      HOME: /home/node
      TERM: xterm-256color
      CLAWDBOT_GATEWAY_BIND: lan
      CLAWDBOT_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - molt_config:/home/node/.clawdbot
      - molt_workspace:/home/node/clawd
    ports:
      - "18789:18789"
      - "18790:18790"
    # Ensure you keep '--allow-unconfigured' and '--bind lan'
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789", "--allow-unconfigured"]

volumes:
  molt_config:
  molt_workspace: